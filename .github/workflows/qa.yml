name: SIAKAD verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        database: [sqlite, mysql]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: siakad_test
          MYSQL_USER: siakad_test
          MYSQL_PASSWORD: test_only_password
          MYSQL_ROOT_PASSWORD: ci_root_only_password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype,curl,dom,fileinfo,mbstring,openssl,pdo_mysql,pdo_sqlite,xml,xmlwriter,zip
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction
      - run: composer check-platform-reqs
      - run: php scripts/test-planner.php
      - name: Native PHPUnit
        run: |
          if [ '${{ matrix.database }}' = 'mysql' ]; then
            php vendor/bin/phpunit -c phpunit.mysql.xml
          else
            php vendor/bin/phpunit -c phpunit.xml
          fi
      - run: composer audit --locked --no-dev
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --check resources/js/app.js
      - run: npm audit --audit-level=high
      - run: cmp resources/js/app.js public/assets/app.js && cmp resources/css/app.css public/assets/app.css
